include:
  - project: 'qquest/gitlab-ci-templates'
    file: '/role-templates/include-all-role-templates.yml'

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline" 
      variables:
        INVENTORY: api-trigger-host.ini
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
      when: never
    - when: always

stages:  
  - build_frontend
  - build_backend 
  - deploy_prod_frontend
  - deploy_prod_backend
  - add-to-redirect

build_frontend:
    stage: build_frontend
    image: docker:20
    variables:
        APP_NAME: qquest-narrowcaster
        IMAGE_TAG: latest
    services:
        - name: docker:20.10.23-dind
          command: ["--tls=false"]

    script:
        - docker build -t $CI_REGISTRY/qquest/$CI_PROJECT_NAME/$APP_NAME:$IMAGE_TAG .
        - docker login $CI_REGISTRY -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD
        - docker push $CI_REGISTRY/qquest/$CI_PROJECT_NAME/$APP_NAME:$IMAGE_TAG


build_backend:
    stage: build_backend
    image: docker:20
    variables:
        APP_NAME: qquest-narrowcaster-api
        IMAGE_TAG: latest
    services:
        - name: docker:20.10.23-dind
          command: ["--tls=false"]

    script:
        # Navigate to the 'server' folder where the Dockerfile is located
        - docker build -t $CI_REGISTRY/qquest/$CI_PROJECT_NAME/$APP_NAME:$IMAGE_TAG -f server/Dockerfile ./server
        - docker login $CI_REGISTRY -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD
        - docker push $CI_REGISTRY/qquest/$CI_PROJECT_NAME/$APP_NAME

deploy_prod_frontend:
  extends: .ansible-deploy-template
  stage: deploy_prod_frontend
  image: cytopia/ansible:latest-tools 
  variables:
      APP_NAME: qquest-narrowcaster
      IMAGE_TAG: latest
      INVENTRORY: "host.ini"
  before_script:
    - !reference [.ansible-deploy-template, before_script]
    - echo "cloning project ansible playbook"
    - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/qquest/ansible/project-guus-ansible.git    
    - export ANSIBLE_HOST_KEY_CHECKING=False
    - sed -i "s/<MAIN-IP-GAAT-HIER>/$MAIN_DROPLET/" project-guus-ansible/api-trigger-host.ini

  script:
    - ansible-playbook project-guus-ansible/playbook.yml -i project-guus-ansible/${INVENTORY} --vault-password-file .passfile --extra-vars "CTRLQ_USER=$CTRLQ_USER_NAME CTRLQ_USER_BECOME_PASS=$CTRLQ_USER_PASSWORD"
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline" #Runt alleen via een API trigger call (wordt gebruikt in de main droplet)
      when: on_success
      allow_failure: false
    - if: '$CI_PIPELINE_SOURCE != "pipeline" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
      allow_failure: false

deploy_prod_backend:
  extends: .ansible-deploy-template
  stage: deploy_prod_backend
  image: cytopia/ansible:latest-tools 
  variables:
      APP_NAME: qquest-narrowcaster-api
      IMAGE_TAG: latest
      INVENTRORY: "host.ini"
      ENV: |
          VITE_NS_KEY = $NS_KEY
          VITE_FORECAST_API_KEY = $FORECASTER_API_KEY
          VITE_FACTS_API_KEY = $FACTS_API_KEY
  before_script:
    - !reference [.ansible-deploy-template, before_script]
    - echo "cloning project ansible playbook"
    - git clone https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/qquest/ansible/project-guus-ansible.git    
    - export ANSIBLE_HOST_KEY_CHECKING=False
    - sed -i "s/<MAIN-IP-GAAT-HIER>/$MAIN_DROPLET/" project-guus-ansible/api-trigger-host.ini

  script:
    - ansible-playbook project-guus-ansible/playbook.yml -i project-guus-ansible/${INVENTORY} --vault-password-file .passfile --extra-vars "CTRLQ_USER=$CTRLQ_USER_NAME CTRLQ_USER_BECOME_PASS=$CTRLQ_USER_PASSWORD"
  rules:
    - if: $CI_PIPELINE_SOURCE == "pipeline" #Runt alleen via een API trigger call (wordt gebruikt in de main droplet)
      when: on_success
      allow_failure: false
    - if: '$CI_PIPELINE_SOURCE != "pipeline" && $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      when: on_success
      allow_failure: false

add-to-redirect-prod:
  extends: .add-to-redirect-prod
  stage: add-to-redirect
  variables:
        PROXY_SUBDIR: prod